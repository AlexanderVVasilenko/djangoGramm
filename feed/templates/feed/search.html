{% extends "base_authorised.html" %}

{% block sub_content %}
    <div class="container">
    <h2 class="mb-4">Search</h2>
    <form method="get" class="mb-4">
        <input
        type="text"
        name="q"
        class="form-control"
        placeholder="Search user..."
        value="{{ query }}"
        >
    </form>
    <div class="d-flex flex-column gap-3">
        {% for user in users %}
            <a
                href="{% url 'profile' pk=user.username %}"
                class="text-decoration-none text-dark"
                >
            <div class="card p-3">
                <div class="fw-bold">
                    {{ user.username }}
                </div>

                {% if user.name %}
                    <div class="text-muted">
                    {{ user.name }}
                    </div>
                {% endif %}
            </div>
            </a>
            {% empty %}
            <p>No users found.</p>
        {% endfor %}
    </div>
    </div>
{% endblock %}
